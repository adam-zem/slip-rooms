<!DOCTYPE html>
<html>
<head>
  <title>Direct Room Fix</title>
  <style>
    body { font-family: sans-serif; background: #0a0a0a; color: #fff; padding: 40px; }
    .log { background: #141414; padding: 12px; margin: 8px 0; border-radius: 8px; white-space: pre-wrap; }
    .success { border-left: 3px solid #047857; }
    .error { border-left: 3px solid #ef4444; }
    button { background: #047857; color: #fff; border: none; padding: 16px 24px; border-radius: 8px; cursor: pointer; margin: 8px; }
    button.danger { background: #dc2626; }
  </style>
</head>
<body>
  <h1>Direct Room Fix</h1>
  <button onclick="doEverything()">FIX EVERYTHING</button>
  <div id="log"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDocs, updateDoc, deleteDoc, collection } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const app = initializeApp({
      apiKey: "AIzaSyDQXCKVagyRi1OhhgjyPgZxoBuPVRD_R8Y",
      authDomain: "sliprooms-279e3.firebaseapp.com",
      projectId: "sliprooms-279e3"
    });

    const auth = getAuth(app);
    const db = getFirestore(app);

    function log(msg, type = '') {
      const div = document.createElement('div');
      div.className = `log ${type}`;
      div.textContent = msg;
      document.getElementById('log').appendChild(div);
    }

    window.doEverything = async function() {
      document.getElementById('log').innerHTML = '';

      try {
        await signInWithEmailAndPassword(auth, 'demo@sliprooms.com', 'SlipRooms2026!');
        log('✓ Signed in', 'success');
      } catch(e) {
        log('✗ Sign in failed: ' + e.message, 'error');
        return;
      }

      try {
        const snapshot = await getDocs(collection(db, 'rooms'));
        log(`Found ${snapshot.size} rooms total`);

        for (const docSnap of snapshot.docs) {
          const room = docSnap.data();
          const id = docSnap.id;
          const name = room.name || 'NO NAME';

          log(`\nRoom: "${name}" (ID: ${id})`);

          // Fix Luka room - Lakers purple
          if (name.toLowerCase().includes('luka') || name.toLowerCase().includes('doncic')) {
            try {
              await updateDoc(doc(db, 'rooms', id), {
                name: 'LUKA DONCIC OVER 32.5 POINTS',
                teamColor: '#552583',
                isDemoRoom: true
              });
              log('  → Updated to "LUKA DONCIC OVER 32.5 POINTS" + Lakers purple', 'success');
            } catch(e) {
              log('  ✗ Update failed: ' + e.message, 'error');
            }
          }

          // Fix Zibanejad room - Rangers blue
          else if (name.toLowerCase().includes('ziban') || name.toLowerCase().includes('mika')) {
            try {
              await updateDoc(doc(db, 'rooms', id), {
                name: 'MIKA ZIBANEJAD OVER 1.5 ASSISTS',
                teamColor: '#0038A8',
                isDemoRoom: true
              });
              log('  → Updated to "MIKA ZIBANEJAD OVER 1.5 ASSISTS" + Rangers blue', 'success');
            } catch(e) {
              log('  ✗ Update failed: ' + e.message, 'error');
            }
          }

          // Delete Warriors room
          else if (name.toLowerCase().includes('warrior') || name.toLowerCase().includes('golden state')) {
            try {
              await deleteDoc(doc(db, 'rooms', id));
              log('  → DELETED', 'success');
            } catch(e) {
              log('  ✗ Delete failed: ' + e.message, 'error');
            }
          }

          else {
            log('  (no action needed)');
          }
        }

        log('\n\nDONE! Restart the app to see changes.', 'success');

      } catch(e) {
        log('Error reading rooms: ' + e.message, 'error');
      }
    };
  </script>
</body>
</html>
