<!DOCTYPE html>
<html>
<head>
  <title>Seed Chalkeater Friendship</title>
  <style>
    body { font-family: sans-serif; background: #0a0a0a; color: #fff; padding: 40px; }
    .status { background: #141414; padding: 12px; margin: 8px 0; border-radius: 8px; }
    .success { border-left: 3px solid #047857; }
    .error { border-left: 3px solid #ef4444; }
    button { background: #047857; color: #fff; border: none; padding: 16px 32px; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Seed Chalkeater Friendship</h1>
  <button onclick="createFriendship()">Create Friendship</button>
  <div id="log"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const app = initializeApp({
      apiKey: "AIzaSyDQXCKVagyRi1OhhgjyPgZxoBuPVRD_R8Y",
      authDomain: "sliprooms-279e3.firebaseapp.com",
      projectId: "sliprooms-279e3",
      storageBucket: "sliprooms-279e3.firebasestorage.app",
      messagingSenderId: "646844776858",
      appId: "1:646844776858:web:f2ed004f7205318742fa23"
    });

    const auth = getAuth(app);
    const db = getFirestore(app);

    const DEMO_UID = "oKQej2e1zyMszsxxr3jDePR8fV42";
    const CHALKEATER_UID = "CirK90JpW0e3ngBdg8fHGQfaY7q1";

    function log(msg, type) {
      const div = document.createElement('div');
      div.className = `status ${type}`;
      div.textContent = msg;
      document.getElementById('log').appendChild(div);
    }

    window.createFriendship = async function() {
      document.getElementById('log').innerHTML = '';

      try {
        await signInWithEmailAndPassword(auth, 'demo@sliprooms.com', 'SlipRooms2026!');
        log('Signed in as demo', 'success');

        // Demo -> Chalkeater
        const id1 = `${DEMO_UID}_${CHALKEATER_UID}`;
        log(`Creating friendship doc: ${id1}`, 'success');
        await setDoc(doc(db, 'friendships', id1), {
          users: [DEMO_UID, CHALKEATER_UID],
          user1: DEMO_UID,
          user2: CHALKEATER_UID,
          createdAt: serverTimestamp()
        });
        log('Created: demo -> chalkeater', 'success');

        // Chalkeater -> Demo
        const id2 = `${CHALKEATER_UID}_${DEMO_UID}`;
        log(`Creating friendship doc: ${id2}`, 'success');
        await setDoc(doc(db, 'friendships', id2), {
          users: [CHALKEATER_UID, DEMO_UID],
          user1: CHALKEATER_UID,
          user2: DEMO_UID,
          createdAt: serverTimestamp()
        });
        log('Created: chalkeater -> demo', 'success');

        log('DONE!', 'success');
      } catch (error) {
        log(`Error: ${error.code} - ${error.message}`, 'error');
        console.error(error);
      }
    };
  </script>
</body>
</html>
