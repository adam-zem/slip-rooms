<!DOCTYPE html>
<html>
<head>
  <title>Check Demo Terms</title>
  <style>
    body { font-family: sans-serif; background: #0a0a0a; color: #fff; padding: 40px; }
    .log { background: #141414; padding: 12px; margin: 8px 0; border-radius: 8px; white-space: pre-wrap; }
    .success { border-left: 3px solid #047857; }
    .error { border-left: 3px solid #ef4444; }
    button { background: #047857; color: #fff; border: none; padding: 16px 24px; border-radius: 8px; cursor: pointer; margin: 8px; }
    button.danger { background: #dc2626; }
  </style>
</head>
<body>
  <h1>Check/Clear Demo Account Terms</h1>
  <button onclick="checkTerms()">Check Demo Account</button>
  <button class="danger" onclick="clearTerms()">Clear agreedToTerms</button>
  <div id="log"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc, deleteField } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const app = initializeApp({
      apiKey: "AIzaSyDQXCKVagyRi1OhhgjyPgZxoBuPVRD_R8Y",
      authDomain: "sliprooms-279e3.firebaseapp.com",
      projectId: "sliprooms-279e3"
    });

    const auth = getAuth(app);
    const db = getFirestore(app);
    const DEMO_UID = "oKQej2e1zyMszsxxr3jDePR8fV42";

    function log(msg, type = '') {
      const div = document.createElement('div');
      div.className = `log ${type}`;
      div.textContent = msg;
      document.getElementById('log').appendChild(div);
    }

    window.checkTerms = async function() {
      document.getElementById('log').innerHTML = '';
      try {
        await signInWithEmailAndPassword(auth, 'demo@sliprooms.com', 'SlipRooms2026!');
        log('Signed in', 'success');

        const docSnap = await getDoc(doc(db, 'users', DEMO_UID));
        if (docSnap.exists()) {
          const data = docSnap.data();
          log(`\nDemo Account Profile:`, 'success');
          log(`  agreedToTerms: ${data.agreedToTerms}`);
          log(`  agreedAt: ${data.agreedAt}`);
          log(`  termsAcceptedAt: ${data.termsAcceptedAt}`);
          log(`\nFull profile:\n${JSON.stringify(data, null, 2)}`);
        } else {
          log('Demo account profile does not exist!', 'error');
        }
      } catch(e) {
        log('Error: ' + e.message, 'error');
      }
    };

    window.clearTerms = async function() {
      document.getElementById('log').innerHTML = '';
      try {
        await signInWithEmailAndPassword(auth, 'demo@sliprooms.com', 'SlipRooms2026!');
        log('Signed in', 'success');

        await updateDoc(doc(db, 'users', DEMO_UID), {
          agreedToTerms: deleteField(),
          agreedAt: deleteField()
        });
        log('Cleared agreedToTerms and agreedAt fields!', 'success');
        log('\nNow restart the app - the Terms modal should persist.', 'success');
      } catch(e) {
        log('Error: ' + e.message, 'error');
      }
    };
  </script>
</body>
</html>
